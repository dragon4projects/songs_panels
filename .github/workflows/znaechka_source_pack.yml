name: Znaechka source pack extraction

on:
  push:
    branches:
      - art/znaechka-characters-ZNA_CHAR_NPC_20261123_001
    paths:
      - .github/workflows/znaechka_source_pack.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout art branch with LFS
        uses: actions/checkout@v4
        with:
          ref: art/znaechka-characters-ZNA_CHAR_NPC_20261123_001
          fetch-depth: 1
          lfs: true

      - name: Pull real LFS bytes
        run: git lfs pull

      - name: Build private source pack
        shell: bash
        run: |
          set -euo pipefail
          ROOT=dragon_house_clean
          OUT=znaechka_source_pack
          mkdir -p "$OUT/identities" "$OUT/baseline" "$OUT/meta"

          cp "$ROOT/assets/residents/RES_22/identity/lisa_03.png" "$OUT/identities/RES_22_LISA_03.png"
          cp "$ROOT/assets/residents/RES_23/identity/valenta_03.png" "$OUT/identities/RES_23_VALENTA_03.png"
          cp "$ROOT/assets/residents/RES_24/identity/lisa_01.png" "$OUT/identities/RES_24_LISA_01.png"

          cp "$ROOT/data/resident_profiles.json" "$OUT/meta/"
          cp "$ROOT/data/asset_registry_nov2026.json" "$OUT/meta/"
          cp "$ROOT/assets/manifests/bank_coverage.json" "$OUT/meta/"
          cp "$ROOT/assets/manifests/asset_index.jsonl" "$OUT/meta/"
          cp "$ROOT/assets/manifests/SHA256SUMS.txt" "$OUT/meta/"
          cp "$ROOT/scripts/asset_bank_resolver.gd" "$OUT/meta/"
          cp "$ROOT/scripts/main.gd" "$OUT/meta/"

          python3 - <<'PY'
          from pathlib import Path
          root=Path("dragon_house_clean/assets/residents")
          out=Path("znaechka_source_pack/baseline")
          wanted=["RES_01","RES_02","RES_04","RES_11","RES_18","RES_21"]
          copied=[]
          for rid in wanted:
              base=root/rid/"wardrobes"
              if not base.exists():
                  continue
              candidates=sorted(base.glob("*/IDLE_S/*.png"))
              if not candidates:
                  continue
              p=candidates[0]
              target=out/f"{rid}_{p.parent.parent.name}_IDLE_S_{p.name}"
              target.write_bytes(p.read_bytes())
              copied.append((rid,str(p),str(target)))
          print("BASELINE_COPIED", copied)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path("znaechka_source_pack")
          rows=[]
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  b=p.read_bytes()
                  rows.append({
                      "path": str(p.relative_to(root)),
                      "bytes": len(b),
                      "sha256": hashlib.sha256(b).hexdigest(),
                      "head_hex": b[:16].hex(),
                  })
          Path("znaechka_source_pack/SOURCE_PACK_MANIFEST.json").write_text(
              json.dumps(rows, indent=2, ensure_ascii=False)+"\n", encoding="utf-8"
          )
          PY

      - name: Verify identities are real PNG bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for p in Path("znaechka_source_pack/identities").glob("*.png"):
              b=p.read_bytes()
              assert b.startswith(b"\x89PNG\r\n\x1a\n"), (p, b[:80])
              assert not b.startswith(b"version https://git-lfs.github.com/spec/v1")
              print("REAL_PNG", p, len(b))
          PY

      - name: Upload private source pack
        uses: actions/upload-artifact@v4
        with:
          name: znaechka-source-pack
          path: znaechka_source_pack/
          if-no-files-found: error
          retention-days: 2
