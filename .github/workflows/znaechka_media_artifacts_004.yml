name: Znaechka media artifacts 004 verify

on:
  push:
    branches:
      - art/znaechka-characters-ZNA_CHAR_NPC_20261123_001
    paths:
      - .github/workflows/znaechka_media_artifacts_004.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/znaechka-characters-ZNA_CHAR_NPC_20261123_001
          fetch-depth: 1

      - name: Pull only ZNA004 LFS objects
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="dragon_house_clean/assets/media/previews/audio/**,dragon_house_clean/assets/media/previews/unclassified/**,dragon_house_clean/assets/media/previews/artifacts/**,dragon_house_clean/assets/props/artifacts/cubes/sources/library_confirmed/**"

      - name: Verify exact branch payload
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, hashlib, subprocess
          root=Path('dragon_house_clean')
          man=json.loads((root/'assets/manifests/media_preview_manifest_zna003.json').read_text(encoding='utf-8'))
          assert (len(man['audio']),len(man['film']),len(man['unclassified']))==(203,0,495)
          for kind in ('audio','unclassified'):
              for x in man[kind]:
                  p=root/x['preview_path']
                  assert p.is_file(),p
                  assert not p.read_bytes().startswith(b'version https://git-lfs.github.com/spec/v1'),p
                  Image.open(p).verify()
          assert not list((root/'assets/media/previews/audio').glob('YT_*.png'))
          assert not list((root/'assets/media/previews/unclassified').glob('YT_*.png'))

          art=json.loads((root/'assets/manifests/artifact_master_sources_zna004.json').read_text(encoding='utf-8'))
          assert len(art['entries'])==10
          for e in art['entries']:
              sp=root/e['repo_source_target']; pp=root/e['preview_target']
              assert sp.is_file() and pp.is_file()
              assert not sp.read_bytes().startswith(b'version https://git-lfs.github.com/spec/v1')
              assert not pp.read_bytes().startswith(b'version https://git-lfs.github.com/spec/v1')
              assert hashlib.sha256(sp.read_bytes()).hexdigest()==e['source_sha256'],sp
              assert hashlib.sha256(pp.read_bytes()).hexdigest()==e['preview_sha256'],pp
              Image.open(sp).verify(); Image.open(pp).verify()

          print('FRESH_BRANCH_VERIFY_PASS')
          print('HEAD='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('YOUTUBE_REAL_PREVIEWS=698')
          print('ARTIFACT_SOURCES=10')
          PY
