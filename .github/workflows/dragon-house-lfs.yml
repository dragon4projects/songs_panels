name: Dragon House v0.16 full LFS and Godot acceptance

on:
  push:
    branches: [dragon-house-fallout-fresh]
    paths:
      - 'dragon_house_clean/**'
      - '.github/workflows/dragon-house-lfs.yml'
  pull_request:
    branches: [dragon-house-fallout-fresh]
    paths:
      - 'dragon_house_clean/**'
      - '.github/workflows/dragon-house-lfs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-acceptance:
    name: Verify actual LFS bytes and Godot runtime
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout with LFS content
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Fetch LFS objects (no pointers)
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          echo "LFS_PATHS=$(git lfs ls-files | wc -l)" >> "$GITHUB_ENV"
          test "$(git lfs ls-files | wc -l)" -ge 2408

      - name: Audit normalized LFS paths and canonical identities
        shell: bash
        run: |
          cd dragon_house_clean
          python3 tools/ci_lfs_asset_audit.py --project . --report LFS_ACCEPTANCE_QA.json
          cat LFS_ACCEPTANCE_QA.json

      - name: Render private QA contact sheet (24 IDs, original vs bank)
        shell: bash
        run: |
          python3 -m venv /tmp/dragon-qa-venv
          /tmp/dragon-qa-venv/bin/pip install --disable-pip-version-check --quiet Pillow
          cd dragon_house_clean
          /tmp/dragon-qa-venv/bin/python tools/create_private_review_sheet.py \
            --project . --output private_review/nov2026_all_24.png
          /tmp/dragon-qa-venv/bin/python tests/test_private_review_sheet.py

      - name: Store private QA image for owner review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragon-house-private-character-review
          path: dragon_house_clean/private_review/nov2026_all_24.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Download official Godot 4.7.2 Linux
        shell: bash
        run: |
          curl -fLsS --retry 3 -o /tmp/Godot_4.7.2.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/Godot_4.7.2.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version

      - name: Import actual LFS textures into Godot
        shell: bash
        run: |
          cd dragon_house_clean
          timeout 900s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > godot_import.log 2>&1
          if grep -Eq "SCRIPT ERROR|Parse Error" godot_import.log; then
            tail -80 godot_import.log
            exit 1
          fi

      - name: Test world, media, actual resident artwork and private-room exclusions
        shell: bash
        run: |
          cd dragon_house_clean
          set -euo pipefail
          : > godot_tests.log
          for t in \
            tests/test_model.gd \
            tests/test_cutaway_groups.gd \
            tests/test_camera_construction.gd \
            tests/test_locomotion.gd \
            tests/test_social.gd \
            tests/test_media.gd \
            tests/test_av.gd \
            tests/test_snapshot.gd \
            tests/test_asset_binding.gd \
            tests/test_interior_layers.gd \
            tests/test_registry_integration.gd \
            tests/test_reference_books.gd \
            tests/test_bank_gallery.gd \
            tests/test_room_lod_v06.gd \
            tests/test_cursor_zoom_v06.gd \
            tests/test_room_capacity_v06.gd \
            tests/test_lfs_sprite_anchor_v06.gd \
            tests/test_room_stations_v07.gd \
            tests/test_catalog_browsing_v08.gd \
            tests/test_compact_hud_v08.gd \
            tests/test_sofa_seating_v09.gd \
            tests/test_furniture_contract_v10.gd \
            tests/test_lazy_room_art_v10.gd \
            tests/test_v011_accepted_art.gd \
            tests/test_v011_room_distribution.gd \
            tests/test_v011_depth_pass.gd \
            tests/test_artist_anchor_candidate_v2.gd \
            tests/test_width_anchors_v012.gd \
            tests/test_corridor_passing_v013.gd \
            tests/test_concrete_media_v014.gd \
            tests/test_room_activity_hud_v014.gd \
            tests/test_teea003_owner_production_v016.gd \
            tests/test_private_door_note_v016.gd \
            tests/test_floor_rest_pose_v016.gd \
            tests/test_authored_station_poses_v016.gd; do
            echo "RUN $t" | tee -a godot_tests.log
            result="$(timeout 120s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)" || { echo "$result" | tee -a godot_tests.log; exit 1; }
            echo "$result" | tee -a godot_tests.log
            if ! echo "$result" | grep -q "_PASS";then exit 1;fi
            if echo "$result" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed";then exit 1;fi
          done
          python3 tests/test_import_nov_assets.py | tee -a godot_tests.log

      - name: Render v0.16 production QA views
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          cd dragon_house_clean
          rm -rf private_review/v016
          mkdir -p private_review/v016
          xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path . \
            --rendering-method gl_compatibility \
            --script res://tests/capture_v016_production_review.gd \
            | tee v016_render_review.log
          grep -q "V016_PRODUCTION_REVIEW_PASS" v016_render_review.log
          test "$(find private_review/v016 -maxdepth 1 -name '*.png' | wc -l)" -eq 9

      - name: Store v0.16 production QA views
        uses: actions/upload-artifact@v4
        with:
          name: dragon-house-v016-production-review
          path: |
            dragon_house_clean/private_review/v016/
            dragon_house_clean/v016_render_review.log
          retention-days: 3
          if-no-files-found: error

      - name: Download original Godot 4.7.2 export templates
        shell: bash
        run: |
          curl -fLsS --retry 3 -o /tmp/godot_export.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          dest="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$dest"
          unzip -jo /tmp/godot_export.tpz \
            templates/version.txt templates/windows_release_x86_64.exe \
            templates/windows_debug_x86_64.exe templates/macos.zip -d "$dest"
          ls -lh "$dest"

      - name: Export private Windows and Mac builds with actual LFS textures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cd dragon_house_clean
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --export-release "Windows Desktop" ../releases/DragonHouse_v016.exe \
            > ../releases/win_export.log 2>&1
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --export-release "macOS" ../releases/DragonHouse_v016_macOS_Universal.zip \
            > ../releases/mac_export.log 2>&1
          cd ../releases
          cat > PRIVATE_BUILD_NOTE.txt <<'NOTE'
          Dragon House v0.16 independent Godot 4.7.2 prototype.
          These exports contain private November source imagery fetched from Git LFS.
          They are for owner visual QA only; no resident identity has final approval.
          Windows: keep EXE and PCK together. Mac: universal UNSIGNED, may trigger Gatekeeper.
          Real Windows Dell Latitude 5300 and Apple M1 8GB runs remain untested.
          NOTE
          zip -q9 DragonHouse_v016_Windows10_x64.zip DragonHouse_v016.exe \
            DragonHouse_v016.pck PRIVATE_BUILD_NOTE.txt
          cp DragonHouse_v016_macOS_Universal.zip DragonHouse_v016_macOS15_M1.zip
          zip -q9 DragonHouse_v016_macOS15_M1.zip PRIVATE_BUILD_NOTE.txt
          unzip -t DragonHouse_v016_Windows10_x64.zip | tail -1
          unzip -t DragonHouse_v016_macOS15_M1.zip | tail -1

      - name: Keep private QA binaries (not public releases)
        uses: actions/upload-artifact@v4
        with:
          name: dragon-house-private-v016-windows-mac
          path: |
            releases/DragonHouse_v016_Windows10_x64.zip
            releases/DragonHouse_v016_macOS15_M1.zip
            releases/win_export.log
            releases/mac_export.log
          if-no-files-found: error
          retention-days: 3

      - name: Store private audit proof, never original personal imagery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragon-house-lfs-qa-report
          path: |
            dragon_house_clean/LFS_ACCEPTANCE_QA.json
            dragon_house_clean/godot_import.log
            dragon_house_clean/godot_tests.log
          if-no-files-found: ignore
          retention-days: 7

