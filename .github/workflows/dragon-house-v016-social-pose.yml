name: Dragon House v0.16 social pose QA

on:
  push:
    branches: [dev/dragon-house-v016-social-pose]
    paths:
      - 'dragon_house_clean/scripts/main.gd'
      - 'dragon_house_clean/tests/test_social_pose_v016.gd'
      - '.github/workflows/dragon-house-v016-social-pose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - name: Pull LFS bytes
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull
      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/Godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/Godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Run social and station pose regressions
        run: |
          set -euo pipefail
          cd dragon_house_clean
          timeout 300s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > social_pose_import.log 2>&1
          if grep -Eq 'SCRIPT ERROR|Parse Error|Parser Error' social_pose_import.log; then
            tail -120 social_pose_import.log
            exit 1
          fi
          for t in \
            tests/test_social_pose_v016.gd \
            tests/test_authored_station_poses_v016.gd \
            tests/test_floor_rest_pose_v016.gd \
            tests/test_social.gd; do
            echo "RUN $t"
            result="$(timeout 120s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)"
            echo "$result"
            echo "$result" | grep -q '_PASS'
            if echo "$result" | grep -qE 'SCRIPT ERROR|Parse Error|Assertion failed'; then exit 1; fi
          done
