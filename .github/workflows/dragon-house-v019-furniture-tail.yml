name: Dragon House v0.19 furniture-tail QA

on:
  push:
    branches:
      - fix/dragon-house-v019-furniture-test-frame-boundary
    paths:
      - 'dragon_house_clean/tests/test_furniture_contract_v10.gd'
      - '.github/workflows/dragon-house-v019-furniture-tail.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Godot 4.7.2
        shell: bash
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Parse
        shell: bash
        run: |
          cd dragon_house_clean
          timeout 180s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit > /tmp/import.log 2>&1 || true
          if grep -Eq "SCRIPT ERROR|Parse Error" /tmp/import.log; then
            cat /tmp/import.log
            exit 1
          fi
      - name: Furniture and full remaining runtime tail
        shell: bash
        run: |
          cd dragon_house_clean
          set -euo pipefail
          tests=(
            tests/test_furniture_contract_v10.gd
            tests/test_lazy_room_art_v10.gd
            tests/test_v011_accepted_art.gd
            tests/test_v011_room_distribution.gd
            tests/test_v011_depth_pass.gd
            tests/test_artist_anchor_candidate_v2.gd
            tests/test_width_anchors_v012.gd
            tests/test_corridor_passing_v013.gd
            tests/test_concrete_media_v014.gd
            tests/test_room_activity_hud_v014.gd
            tests/test_private_door_note_v016.gd
            tests/test_teea003_owner_production_v016.gd
            tests/test_floor_rest_pose_v016.gd
            tests/test_authored_station_poses_v016.gd
            tests/test_seated_talk_pose_v016.gd
            tests/test_object_lifecycle_v017.gd
            tests/test_ambient_creatures_v018.gd
            tests/test_content_viewer_v018.gd
            tests/test_guest_room_access_v018.gd
            tests/test_life_scheduler_v019.gd
            tests/test_life_due_wake_integration_v019.gd
            tests/test_semantic_view_v019.gd
            tests/test_level_mode_v019.gd
            tests/test_object_event_gate_v020.gd
            tests/test_object_event_replay_v020.gd
            tests/test_object_event_migration_v020.gd
          )
          for t in "${tests[@]}"; do
            echo "RUN $t"
            out="$(timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$t" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "_PASS"
            ! echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Assertion failed"
          done
