name: Artifact glass cubes one-shot intake
on:
  push:
    branches: [assets/cgtrader-coffee-mugs-20261124]
    paths: ['.github/workflows/artifact-glass-cubes-intake.yml']
permissions:
  contents: write
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - name: Import verified original Blender assets
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          curl -fLsS --retry 2 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JdI9kJ82xObF8Bi3EgU4P6DaoR/76e3dded-5d7b-4cea-b239-b09448f71fab.zip' -o /tmp/cubes.zip
          echo '510e623580616621b0ad6307f97904fb7cfa6d83019bf01ac32be87a169b1c22  /tmp/cubes.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib, hashlib, json
          base=pathlib.Path('dragon_house_clean')
          prefixes=["dragon_house_clean/assets/decor_bank/artifact_glass_cube_s/","dragon_house_clean/assets/decor_bank/artifact_glass_cube_m/","dragon_house_clean/assets/decor_bank/artifact_glass_cube_l/","dragon_house_clean/assets_external/authoring/artifact_glass_cubes/","dragon_house_clean/data/asset_proposals/ARTIFACT_GLASS_CUBES_20261125/"]
          with zipfile.ZipFile('/tmp/cubes.zip') as z:
              for f in z.infolist():
                  if f.is_dir(): continue
                  assert '..' not in pathlib.PurePosixPath(f.filename).parts and any(f.filename.startswith(p) for p in prefixes), f.filename
                  p=pathlib.Path(f.filename)
                  assert not p.exists(), p
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(f))
          manifest=json.loads((base/'data/asset_proposals/ARTIFACT_GLASS_CUBES_20261125/dependency_manifest.json').read_text())
          for row in manifest['items']:
              p=base/row['path']
              assert p.stat().st_size==row['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256'], p
          print('Verified',len(manifest['items']),'files')
          PY
          git config user.name 'dragon-house-asset-intake'
          git config user.email 'dragon-house-asset-intake@users.noreply.github.com'
          git add -- dragon_house_clean/assets/decor_bank/artifact_glass_cube_s/ dragon_house_clean/assets/decor_bank/artifact_glass_cube_m/ dragon_house_clean/assets/decor_bank/artifact_glass_cube_l/ dragon_house_clean/assets_external/authoring/artifact_glass_cubes/ dragon_house_clean/data/asset_proposals/ARTIFACT_GLASS_CUBES_20261125/
          git commit -m 'assets: three original empty glass artifact cubes with Blender sources'
          git push origin HEAD:refs/heads/assets/cgtrader-coffee-mugs-20261124
