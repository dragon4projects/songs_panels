name: Znaechka Miu integrate

on:
  push:
    branches:
      - art/znaechka-characters-ZNA_CHAR_NPC_20261123_001
    paths:
      - .github/workflows/znaechka_miu_integrate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout art branch with LFS
        uses: actions/checkout@v4
        with:
          ref: art/znaechka-characters-ZNA_CHAR_NPC_20261123_001
          fetch-depth: 0
          lfs: true

      - name: Pull current LFS bytes
        run: git lfs pull

      - name: Download exact reviewed Miu package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JdI9kJ82xObF8Bi3EgU4P6DaoR/5e7f7507-9944-44c2-9ec4-821a1904e250.zip' \
            -o /tmp/miu.zip
          echo '9ec2382db2834f44bf12df4919b7dae755c9548f4eeb365b74e84096150d09cf  /tmp/miu.zip' | sha256sum -c -
          rm -rf /tmp/miu
          mkdir -p /tmp/miu
          unzip -q /tmp/miu.zip -d /tmp/miu

      - name: Validate Miu bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json

          P=Path('/tmp/miu')
          R=P/'dragon_house_clean'
          rd=R/'assets/residents/NPC_GINGER_CAT_GUEST'
          expected={
            'IDLE_N':1,'IDLE_NE':1,'IDLE_E':1,'IDLE_SE':1,'IDLE_S':1,'IDLE_SW':1,'IDLE_W':1,'IDLE_NW':1,
            'WALK_LEFT':12,'WALK_RIGHT':12,'SIT':1,'RELAXED_SIT':1,'TALK':1,'VIEW':1,'READ':1,'DRINK':4,
            'CARRY_USE':1,'LIE_SIDE_STRAIGHT':1,'LIE_SIDE_CURLED':1,'SLEEP':1,'SIT_HUG_KNEES':1,'SIT_LEGS_TUCKED':1
          }
          issues=[]
          pngs=sorted(rd.rglob('*.png'))
          if len(pngs)!=48: issues.append(f'PNG total {len(pngs)} != 48')
          wd=rd/'wardrobes/SHORT'
          states={d.name:len(list(d.glob('*.png'))) for d in wd.iterdir() if d.is_dir()}
          if states!=expected: issues.append(f'state/count mismatch: {states}')
          for f in pngs:
              im=Image.open(f)
              if im.size!=(512,512): issues.append(f'{f}: size {im.size}')
              if im.mode!='RGBA': issues.append(f'{f}: mode {im.mode}')
              if im.getchannel('A').getbbox() is None: issues.append(f'{f}: blank alpha')
          for d in wd.iterdir():
              if not d.is_dir(): continue
              names=[p.name for p in sorted(d.glob('*.png'))]
              exp=[f'{i:04d}.png' for i in range(1,len(names)+1)]
              if names!=exp: issues.append(f'{d.name}: numbering {names}')
          hf=P/'assets/manifests/SHA256SUMS.delta.txt'
          for line in hf.read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              h,path=line.split(maxsplit=1); path=path.strip().lstrip('*')
              f=R/path
              if not f.exists(): issues.append(f'missing hash target {path}'); continue
              if hashlib.sha256(f.read_bytes()).hexdigest()!=h: issues.append(f'hash mismatch {path}')
          idx=[json.loads(x) for x in (P/'assets/manifests/asset_index.delta.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          if len(idx)!=48: issues.append(f'asset_index entries {len(idx)} != 48')
          for x in idx:
              if not (R/x['destination_path']).exists(): issues.append(f"index target missing {x['destination_path']}")
          if issues: raise SystemExit('\n'.join(issues))
          print('MIU_PACKAGE_QA_PASS 48 PNG')
          PY

      - name: Merge Miu delta only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil

          repo=Path('.')
          pkg=Path('/tmp/miu')
          dst=repo/'dragon_house_clean'
          src=pkg/'dragon_house_clean'
          rid='NPC_GINGER_CAT_GUEST'

          a=src/'assets/residents'/rid
          b=dst/'assets/residents'/rid
          if b.exists(): shutil.rmtree(b)
          shutil.copytree(a,b)

          shutil.copy2(src/'assets/manifests/ginger_cat_guest_provenance.json',
                       dst/'assets/manifests/ginger_cat_guest_provenance.json')

          # Registry delta: preserve stable technical ID, use canonical display name МИУ.
          reg_path=dst/'data/asset_registry_nov2026.json'
          reg=json.loads(reg_path.read_text(encoding='utf-8'))
          delta=json.loads((pkg/'assets/manifests/asset_registry.delta.json').read_text(encoding='utf-8'))
          entry=delta['residents'][rid]
          entry['display_name']='Миу'
          reg.setdefault('residents',{})[rid]=entry
          reg_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Coverage delta.
          cov_path=dst/'assets/manifests/bank_coverage.json'
          cov=json.loads(cov_path.read_text(encoding='utf-8'))
          dcv=json.loads((pkg/'assets/manifests/bank_coverage.delta.json').read_text(encoding='utf-8'))
          cov.setdefault('residents',{})[rid]=dcv['residents'][rid]
          cov_path.write_text(json.dumps(cov,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Asset index merge by destination path.
          idx_path=dst/'assets/manifests/asset_index.jsonl'
          old=[json.loads(x) for x in idx_path.read_text(encoding='utf-8').splitlines() if x.strip()] if idx_path.exists() else []
          new=[json.loads(x) for x in (pkg/'assets/manifests/asset_index.delta.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          npaths={x['destination_path'] for x in new}
          old=[x for x in old if x.get('destination_path') not in npaths]
          idx_path.write_text('\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in old+new)+'\n',encoding='utf-8')

          # SHA merge by asset path.
          sha_path=dst/'assets/manifests/SHA256SUMS.txt'
          old_lines=sha_path.read_text(encoding='utf-8').splitlines() if sha_path.exists() else []
          new_lines=[x for x in (pkg/'assets/manifests/SHA256SUMS.delta.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          def key(line):
              parts=line.split(maxsplit=1)
              return parts[1].strip().lstrip('*') if len(parts)==2 else line
          nkeys={key(x) for x in new_lines}
          old_lines=[x for x in old_lines if x.strip() and key(x) not in nkeys]
          sha_path.write_text('\n'.join(old_lines+new_lines)+'\n',encoding='utf-8')

          # Handoff docs/previews.
          hand=dst/'docs/handoffs/NPC_GINGER_CAT_GUEST_MIU_20261123'
          hand.mkdir(parents=True,exist_ok=True)
          shutil.copy2(pkg/'README.md',hand/'README.md')
          shutil.copy2(pkg/'IMAGEGEN_PROMPTS.md',hand/'IMAGEGEN_PROMPTS.md')
          shutil.copy2(pkg/'previews/NPC_GINGER_CAT_GUEST_SHORT.jpg',hand/'NPC_GINGER_CAT_GUEST_SHORT.jpg')
          qa='''# Миу / NPC_GINGER_CAT_GUEST — Integrator QA\n\nStatus: TECHNICAL PASS / OWNER ART APPROVAL PENDING\n\n- Display name: Миу\n- Technical ID: NPC_GINGER_CAT_GUEST\n- Wardrobe delivered: SHORT\n- States: 22\n- Gameplay frames: 47\n- Identity frames: 1\n- Total PNG: 48\n- Canvas: 512x512 RGBA transparent\n- Walk: 12 left + 12 right\n- Drink: 4 frames\n- Package SHA-256: 9ec2382db2834f44bf12df4919b7dae755c9548f4eeb365b74e84096150d09cf\n\nThe technical ID was preserved to keep all package paths stable. Registry display_name was normalized to “Миу”.\n'''
          (hand/'INTEGRATOR_QA_MIU.md').write_text(qa,encoding='utf-8')
          PY

      - name: Post-merge safety QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('dragon_house_clean')
          reg=json.loads((root/'data/asset_registry_nov2026.json').read_text(encoding='utf-8'))
          assert reg['residents']['NPC_GINGER_CAT_GUEST']['display_name']=='Миу'
          for i in range(1,22):
              assert f'RES_{i:02d}' in reg['residents'], f'RES_{i:02d}'
          assert 'NPC_VAMPIRE_GIRL' in reg['residents']
          assert 'NPC_CENTAUR' in reg['residents']
          pngs=list((root/'assets/residents/NPC_GINGER_CAT_GUEST').rglob('*.png'))
          assert len(pngs)==48, len(pngs)
          print('POST_MERGE_MIU_QA_PASS')
          PY

      - name: Commit Miu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Znaechka Integration Bot'
          git config user.email 'znaechka-integration@users.noreply.github.com'
          git add \
            dragon_house_clean/assets/residents/NPC_GINGER_CAT_GUEST \
            dragon_house_clean/assets/manifests/ginger_cat_guest_provenance.json \
            dragon_house_clean/data/asset_registry_nov2026.json \
            dragon_house_clean/assets/manifests/asset_index.jsonl \
            dragon_house_clean/assets/manifests/bank_coverage.json \
            dragon_house_clean/assets/manifests/SHA256SUMS.txt \
            dragon_house_clean/docs/handoffs/NPC_GINGER_CAT_GUEST_MIU_20261123
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'art(npc): add Miu guest bank'
            git push origin HEAD:art/znaechka-characters-ZNA_CHAR_NPC_20261123_001
          fi
