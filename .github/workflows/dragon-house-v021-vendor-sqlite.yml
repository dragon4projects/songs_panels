name: Dragon House v0.21 one-shot vendor SQLite

on:
  push:
    branches:
      - integration/dragon-house-v021-sqlite-object-core
    paths:
      - '.github/workflows/dragon-house-v021-vendor-sqlite.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Vendor pinned godot-sqlite v4.9 target platforms only
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local

          curl -fLsS --retry 3 -o /tmp/godot-sqlite-addons.zip \
            https://github.com/2shady4u/godot-sqlite/releases/download/v4.9/addons.zip
          echo "95e91b72fe32984a84edaf6357a78753661f37a170cb362f5b948e0ede7c2cb0  /tmp/godot-sqlite-addons.zip" | sha256sum -c -

          rm -rf /tmp/godot-sqlite
          mkdir -p /tmp/godot-sqlite
          unzip -q /tmp/godot-sqlite-addons.zip -d /tmp/godot-sqlite
          DESCRIPTOR="$(find /tmp/godot-sqlite -name gdsqlite.gdextension -type f | head -1)"
          test -n "$DESCRIPTOR"
          SRC="$(dirname "$DESCRIPTOR")"

          cd dragon_house_clean
          rm -rf addons/godot-sqlite
          mkdir -p addons/godot-sqlite/bin

          cp "$SRC/gdsqlite.gdextension.uid" addons/godot-sqlite/gdsqlite.gdextension.uid
          cp "$SRC/bin/libgdsqlite.linux.template_debug.x86_64.so" addons/godot-sqlite/bin/
          cp "$SRC/bin/libgdsqlite.linux.template_release.x86_64.so" addons/godot-sqlite/bin/
          cp "$SRC/bin/libgdsqlite.windows.template_debug.x86_64.dll" addons/godot-sqlite/bin/
          cp "$SRC/bin/libgdsqlite.windows.template_release.x86_64.dll" addons/godot-sqlite/bin/
          cp -a "$SRC/bin/libgdsqlite.macos.template_debug.framework" addons/godot-sqlite/bin/
          cp -a "$SRC/bin/libgdsqlite.macos.template_release.framework" addons/godot-sqlite/bin/

          cat > addons/godot-sqlite/gdsqlite.gdextension <<'EOF'
          [configuration]

          entry_symbol = "sqlite_library_init"
          compatibility_minimum = "4.7"

          [libraries]

          macos.debug = "res://addons/godot-sqlite/bin/libgdsqlite.macos.template_debug.framework"
          macos.release = "res://addons/godot-sqlite/bin/libgdsqlite.macos.template_release.framework"
          windows.debug.x86_64 = "res://addons/godot-sqlite/bin/libgdsqlite.windows.template_debug.x86_64.dll"
          windows.release.x86_64 = "res://addons/godot-sqlite/bin/libgdsqlite.windows.template_release.x86_64.dll"
          linux.debug.x86_64 = "res://addons/godot-sqlite/bin/libgdsqlite.linux.template_debug.x86_64.so"
          linux.release.x86_64 = "res://addons/godot-sqlite/bin/libgdsqlite.linux.template_release.x86_64.so"

          [dependencies]
          EOF
          sed -i 's/^          //' addons/godot-sqlite/gdsqlite.gdextension

          curl -fLsS --retry 3 \
            https://raw.githubusercontent.com/2shady4u/godot-sqlite/9cbdb225823ee111342ce32fe451e066eb92cc6e/LICENSE.md \
            -o addons/godot-sqlite/LICENSE.md
          curl -fLsS --retry 3 \
            https://raw.githubusercontent.com/2shady4u/godot-sqlite/9cbdb225823ee111342ce32fe451e066eb92cc6e/src/sqlite/LICENSE.md \
            -o addons/godot-sqlite/SQLITE_LICENSE.md

          cat > addons/godot-sqlite/DRAGON_HOUSE_VENDOR_PROVENANCE.md <<'EOF'
          # Vendored Godot SQLite provenance

          Upstream: 2shady4u/godot-sqlite
          Release: v4.9
          Upstream commit: 9cbdb225823ee111342ce32fe451e066eb92cc6e
          Release asset: addons.zip
          Release asset SHA-256: 95e91b72fe32984a84edaf6357a78753661f37a170cb362f5b948e0ede7c2cb0
          Compatibility minimum declared upstream: Godot 4.7
          Dragon House target engine: Godot 4.7.2

          Vendored platform binaries are intentionally limited to:
          - Linux x86_64 debug/release for CI/editor proof
          - Windows x86_64 debug/release
          - macOS universal debug/release frameworks

          Android, iOS and Web binaries are intentionally not vendored.
          See LICENSE.md and SQLITE_LICENSE.md.
          EOF

          if ! grep -q '^addons/godot-sqlite/bin/\*\* ' .gitattributes; then
            printf '\n# Native SQLite GDExtension binaries; separate from art manifests.\naddons/godot-sqlite/bin/** filter=lfs diff=lfs merge=lfs -text\n' >> .gitattributes
          fi

          test -s addons/godot-sqlite/bin/libgdsqlite.linux.template_release.x86_64.so
          test -s addons/godot-sqlite/bin/libgdsqlite.windows.template_release.x86_64.dll
          test -s addons/godot-sqlite/bin/libgdsqlite.macos.template_release.framework/libgdsqlite.macos.template_release
          grep -q 'compatibility_minimum = "4.7"' addons/godot-sqlite/gdsqlite.gdextension
          ! grep -Eq 'android|ios|web' addons/godot-sqlite/gdsqlite.gdextension

          git add .gitattributes addons/godot-sqlite
          git lfs ls-files | grep 'addons/godot-sqlite/bin/'
          git status --short

          git config user.name "Dragon House Integrator"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "vendor: pin Godot SQLite v4.9 for Linux Windows macOS"
          git push origin "HEAD:${GITHUB_REF_NAME}"
