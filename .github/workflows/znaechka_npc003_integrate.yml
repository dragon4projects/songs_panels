name: Znaechka NPC003 integrate

on:
  push:
    branches:
      - art/znaechka-characters-ZNA_CHAR_NPC_20261123_001
    paths:
      - .github/workflows/znaechka_npc003_integrate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout art branch with LFS
        uses: actions/checkout@v4
        with:
          ref: art/znaechka-characters-ZNA_CHAR_NPC_20261123_001
          fetch-depth: 0
          lfs: true

      - name: Pull current LFS bytes
        run: git lfs pull

      - name: Download exact reviewed package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JdI9kJ82xObF8Bi3EgU4P6DaoR/fb2bd735-74f4-4bcd-a593-98644f827ba7.zip' \
            -o /tmp/ZNA_CHAR_NPC_20261123_003.zip
          echo '1e549b2ae355a3735a948329ce63466bc90cea3df883a280fb17e457857a8331  /tmp/ZNA_CHAR_NPC_20261123_003.zip' | sha256sum -c -
          rm -rf /tmp/npc003
          mkdir -p /tmp/npc003
          unzip -q /tmp/ZNA_CHAR_NPC_20261123_003.zip -d /tmp/npc003

      - name: Validate reviewed package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json, re

          P=Path('/tmp/npc003')
          R=P/'dragon_house_clean'
          expected_states={
            'IDLE_N':1,'IDLE_NE':1,'IDLE_E':1,'IDLE_SE':1,'IDLE_S':1,'IDLE_SW':1,'IDLE_W':1,'IDLE_NW':1,
            'WALK_LEFT':12,'WALK_RIGHT':12,'SIT':1,'RELAXED_SIT':1,'TALK':1,'VIEW':1,'READ':1,'DRINK':4,
            'CARRY_USE':1,'LIE_SIDE_STRAIGHT':1,'LIE_SIDE_CURLED':1,'SLEEP':1,'SIT_HUG_KNEES':1,'SIT_LEGS_TUCKED':1
          }
          residents=['NPC_VAMPIRE_GIRL','NPC_CENTAUR']
          creatures=[
            'npc_ai_magic_sphere','npc_hedgehog_01','npc_hedgehog_02','npc_hedgehog_03',
            'npc_cat_black_hero','npc_cat_tabby','npc_cat_white','npc_cat_ginger',
            'npc_rat_hero','npc_rat_agouti','npc_rat_white','npc_rat_hooded',
            'npc_cat_calico','npc_cat_sphynx','npc_rat_juvenile_gray'
          ]
          issues=[]
          pngs=list(R.rglob('*.png'))
          if len(pngs)!=479: issues.append(f'PNG total {len(pngs)} != 479')
          for rid in residents:
            rd=R/'assets/residents'/rid
            for wardrobe in ['SHORT','HOME','CITY']:
              wd=rd/'wardrobes'/wardrobe
              states={d.name:len(list(d.glob('*.png'))) for d in wd.iterdir() if d.is_dir()} if wd.exists() else {}
              if states!=expected_states:
                issues.append(f'{rid}/{wardrobe}: state/count mismatch')
          for slug in creatures:
            cd=R/'assets/creatures'/slug
            got={
              'identity':len(list((cd/'identity').glob('*.png'))),
              'idle':len(list((cd/'idle').glob('*.png'))),
              'rest':len(list((cd/'rest').glob('*.png'))),
              'walk_left':len(list((cd/'walk_left').glob('*.png'))),
              'walk_right':len(list((cd/'walk_right').glob('*.png')))
            }
            if got!={'identity':1,'idle':2,'rest':2,'walk_left':4,'walk_right':4}:
              issues.append(f'{slug}: {got}')
          for f in pngs:
            im=Image.open(f)
            rel=f.relative_to(R).as_posix()
            exp=(512,512) if rel.startswith('assets/residents/') else (1024,640)
            if im.size!=exp: issues.append(f'{rel}: size {im.size}, expected {exp}')
            if im.mode!='RGBA': issues.append(f'{rel}: mode {im.mode}')
            if im.getchannel('A').getbbox() is None: issues.append(f'{rel}: blank alpha')
          # SHA delta must match exact package bytes.
          hf=P/'assets/manifests/SHA256SUMS.delta.txt'
          for line in hf.read_text(encoding='utf-8').splitlines():
            if not line.strip(): continue
            h,path=line.split(maxsplit=1); path=path.strip().lstrip('*')
            f=R/path
            if not f.exists(): issues.append(f'hash target missing: {path}'); continue
            ah=hashlib.sha256(f.read_bytes()).hexdigest()
            if ah!=h: issues.append(f'hash mismatch: {path}')
          if issues:
            raise SystemExit('\n'.join(issues))
          print('PACKAGE_QA_PASS', len(pngs), 'PNG')
          PY

      - name: Merge only NPC003 deltas into current branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil

          repo=Path('.')
          pkg=Path('/tmp/npc003')
          dst=repo/'dragon_house_clean'
          src=pkg/'dragon_house_clean'

          residents=['NPC_VAMPIRE_GIRL','NPC_CENTAUR']
          creatures=[
            'npc_ai_magic_sphere','npc_hedgehog_01','npc_hedgehog_02','npc_hedgehog_03',
            'npc_cat_black_hero','npc_cat_tabby','npc_cat_white','npc_cat_ginger',
            'npc_rat_hero','npc_rat_agouti','npc_rat_white','npc_rat_hooded',
            'npc_cat_calico','npc_cat_sphynx','npc_rat_juvenile_gray'
          ]

          # Protect RES_01..RES_21: never copy or rewrite those asset directories.
          for rid in residents:
            a=src/'assets/residents'/rid
            b=dst/'assets/residents'/rid
            if b.exists(): shutil.rmtree(b)
            shutil.copytree(a,b)
          for slug in creatures:
            a=src/'assets/creatures'/slug
            b=dst/'assets/creatures'/slug
            if b.exists(): shutil.rmtree(b)
            shutil.copytree(a,b)

          # Provenance manifest.
          shutil.copy2(src/'assets/manifests/npc_20261123_003_provenance.json',
                       dst/'assets/manifests/npc_20261123_003_provenance.json')

          # Merge registry delta into current registry; preserve all pre-existing entries.
          reg_path=dst/'data/asset_registry_nov2026.json'
          reg=json.loads(reg_path.read_text(encoding='utf-8'))
          delta=json.loads((pkg/'assets/manifests/asset_registry.delta.json').read_text(encoding='utf-8'))
          for section in ('residents','creatures'):
            reg.setdefault(section,{})
            reg[section].update(delta.get(section,{}))
          reg_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Merge bank coverage delta.
          cov_path=dst/'assets/manifests/bank_coverage.json'
          cov=json.loads(cov_path.read_text(encoding='utf-8'))
          dcv=json.loads((pkg/'assets/manifests/bank_coverage.delta.json').read_text(encoding='utf-8'))
          if 'required_states' in dcv: cov['required_states']=dcv['required_states']
          for section in ('residents','creatures'):
            cov.setdefault(section,{})
            cov[section].update(dcv.get(section,{}))
          cov_path.write_text(json.dumps(cov,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Merge asset index by destination_path.
          idx_path=dst/'assets/manifests/asset_index.jsonl'
          old=[]
          if idx_path.exists():
            for ln in idx_path.read_text(encoding='utf-8').splitlines():
              if ln.strip(): old.append(json.loads(ln))
          new=[json.loads(ln) for ln in (pkg/'assets/manifests/asset_index.delta.jsonl').read_text(encoding='utf-8').splitlines() if ln.strip()]
          new_paths={x.get('destination_path') for x in new}
          old=[x for x in old if x.get('destination_path') not in new_paths]
          idx_path.write_text('\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in old+new)+'\n',encoding='utf-8')

          # Merge SHA list by path, replacing only paths in this delta.
          sha_path=dst/'assets/manifests/SHA256SUMS.txt'
          old_lines=sha_path.read_text(encoding='utf-8').splitlines() if sha_path.exists() else []
          new_lines=[ln for ln in (pkg/'assets/manifests/SHA256SUMS.delta.txt').read_text(encoding='utf-8').splitlines() if ln.strip()]
          def key(line):
            parts=line.split(maxsplit=1)
            return parts[1].strip().lstrip('*') if len(parts)==2 else line
          new_keys={key(ln) for ln in new_lines}
          old_lines=[ln for ln in old_lines if ln.strip() and key(ln) not in new_keys]
          sha_path.write_text('\n'.join(old_lines+new_lines)+'\n',encoding='utf-8')

          # Human-review artifacts into docs/handoffs.
          hand=dst/'docs/handoffs/ZNA_CHAR_NPC_20261123_003'
          hand.mkdir(parents=True,exist_ok=True)
          shutil.copy2(pkg/'DELIVERY_REPORT.md', hand/'DELIVERY_REPORT.md')
          shutil.copy2(pkg/'IMAGEGEN_PROMPTS.md', hand/'IMAGEGEN_PROMPTS.md')
          for p in (pkg/'previews').glob('*.jpg'):
            shutil.copy2(p, hand/p.name)

          print('MERGE_READY')
          PY

      - name: Post-merge safety and completeness QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, hashlib
          root=Path('dragon_house_clean')
          reg=json.loads((root/'data/asset_registry_nov2026.json').read_text(encoding='utf-8'))
          # Explicitly assert legacy resident IDs still exist.
          missing=[f'RES_{i:02d}' for i in range(1,22) if f'RES_{i:02d}' not in reg.get('residents',{})]
          if missing: raise SystemExit('Legacy resident registry keys missing: '+str(missing))
          required_res=['NPC_VAMPIRE_GIRL','NPC_CENTAUR']
          required_creatures=[
            'npc_ai_magic_sphere','npc_hedgehog_01','npc_hedgehog_02','npc_hedgehog_03',
            'npc_cat_black_hero','npc_cat_tabby','npc_cat_white','npc_cat_ginger',
            'npc_rat_hero','npc_rat_agouti','npc_rat_white','npc_rat_hooded',
            'npc_cat_calico','npc_cat_sphynx','npc_rat_juvenile_gray'
          ]
          for k in required_res:
            assert k in reg['residents'], k
          for k in required_creatures:
            assert k in reg['creatures'], k

          # Verify every NPC003 index destination exists.
          prov=json.loads((root/'assets/manifests/npc_20261123_003_provenance.json').read_text(encoding='utf-8'))
          count=0
          for p in required_res:
            count += len(list((root/'assets/residents'/p).rglob('*.png')))
          for p in required_creatures:
            count += len(list((root/'assets/creatures'/p).rglob('*.png')))
          assert count==479, count
          print('POST_MERGE_QA_PASS legacy_RES_01_21_present new_png=',count)
          PY

      - name: Commit integrated NPC banks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Znaechka Integration Bot'
          git config user.email 'znaechka-integration@users.noreply.github.com'
          git add dragon_house_clean/assets/residents/NPC_VAMPIRE_GIRL \
                  dragon_house_clean/assets/residents/NPC_CENTAUR \
                  dragon_house_clean/assets/creatures \
                  dragon_house_clean/data/asset_registry_nov2026.json \
                  dragon_house_clean/assets/manifests/asset_index.jsonl \
                  dragon_house_clean/assets/manifests/bank_coverage.json \
                  dragon_house_clean/assets/manifests/SHA256SUMS.txt \
                  dragon_house_clean/assets/manifests/npc_20261123_003_provenance.json \
                  dragon_house_clean/docs/handoffs/ZNA_CHAR_NPC_20261123_003
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'art(npc): integrate ZNA_CHAR_NPC_20261123_003 banks'
            git push origin HEAD:art/znaechka-characters-ZNA_CHAR_NPC_20261123_001
          fi
