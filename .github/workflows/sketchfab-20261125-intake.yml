name: Sketchfab six optimized assets intake
on:
  push:
    branches: [assets/cgtrader-coffee-mugs-20261124]
    paths: ['.github/workflows/sketchfab-20261125-intake.yml']
permissions:
  contents: write
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - name: Import verified assets and push actual LFS data
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          curl -fLsS --retry 2 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JdI9kJ82xObF8Bi3EgU4P6DaoR/1dc7c310-19c2-4eb3-bd85-453879a0f9a3.zip' -o /tmp/sketchfab.zip
          echo '5b2404109d2c30b0708aa20ef6a3eab2e681e93326428c5b460a6578f07ac516  /tmp/sketchfab.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib, hashlib, json
          base = pathlib.Path('dragon_house_clean')
          ids = ["sketchfab_coffee_machine_vervoortward","sketchfab_coffee_machine_serg0k","sketchfab_fireplace_mark_bai","sketchfab_fireplace_animated","sketchfab_fireplace_annabelle_fibonacci","sketchfab_steampunk_coffee_machine"]
          prefixes = [f'dragon_house_clean/assets/decor_bank/{i}/' for i in ids] + ['dragon_house_clean/data/asset_proposals/SKETCHFAB_20261125/']
          with zipfile.ZipFile('/tmp/sketchfab.zip') as z:
              for f in z.infolist():
                  if f.is_dir(): continue
                  assert '..' not in pathlib.PurePosixPath(f.filename).parts and any(f.filename.startswith(p) for p in prefixes), f.filename
                  p = pathlib.Path(f.filename)
                  assert not p.exists(), p
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(z.read(f))
          manifest = json.loads((base/'data/asset_proposals/SKETCHFAB_20261125/dependency_manifest.json').read_text())
          for row in manifest['items']:
              p = base/row['path']
              assert p.stat().st_size == row['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest() == row['sha256'], p
          for i in ids:
              assert (base/'assets/decor_bank'/i/'model.gltf').is_file()
          print('Verified', len(manifest['items']), 'files')
          PY
          git config user.name 'dragon-house-asset-intake'
          git config user.email 'dragon-house-asset-intake@users.noreply.github.com'
          git add -- dragon_house_clean/assets/decor_bank/sketchfab_coffee_machine_vervoortward dragon_house_clean/assets/decor_bank/sketchfab_coffee_machine_serg0k dragon_house_clean/assets/decor_bank/sketchfab_fireplace_mark_bai dragon_house_clean/assets/decor_bank/sketchfab_fireplace_animated dragon_house_clean/assets/decor_bank/sketchfab_fireplace_annabelle_fibonacci dragon_house_clean/assets/decor_bank/sketchfab_steampunk_coffee_machine dragon_house_clean/data/asset_proposals/SKETCHFAB_20261125
          git diff --cached --stat
          git lfs ls-files | grep 'assets/decor_bank/sketchfab_' | head -100
          git commit -m 'assets: add six optimized Sketchfab models and QA'
          git push origin HEAD:refs/heads/assets/cgtrader-coffee-mugs-20261124
